name: Run Agentic SDLC Phase

on:
  workflow_dispatch:
    inputs:
      user_story_id:
        description: "Jira User Story ID"
        required: true
        type: string

      phase:
        description: "SDLC phase"
        required: true
        type: choice
        options:
          - "00"
          - "01"
          - "02"
          - "03"
          - "04"
          - "05"
          - "06"
          - "07"
          - "08"

jobs:
  validate-phase:
    name: Validate Phase ${{ inputs.phase }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate framework
        shell: bash
        run: |
          set -e

          STORY="${{ inputs.user_story_id }}"
          PHASE="${{ inputs.phase }}"
          ARTIFACT_DIR="docs/artifacts/$STORY"

          echo "========================================"
          echo "Agentic SDLC Phase Validation"
          echo "========================================"
          echo "User Story: $STORY"
          echo "Phase:      $PHASE"
          echo "========================================"

          case "$PHASE" in
            00)
              AGENT=".github/copilot/00-input-agent.instructions.md"
              PROMPT=".github/prompts/00-input.md"
              OUTPUT="$ARTIFACT_DIR/user-story.md"
              ;;

            01)
              AGENT=".github/copilot/01-requirements-agent.instructions.md"
              PROMPT=".github/prompts/01-requirements.md"
              OUTPUT="$ARTIFACT_DIR/requirements.md"
              REQUIRED="$ARTIFACT_DIR/user-story.md"
              ;;

            02)
              AGENT=".github/copilot/02-architecture-agent.instructions.md"
              PROMPT=".github/prompts/02-architecture.md"
              OUTPUT="$ARTIFACT_DIR/architecture.md"
              REQUIRED="$ARTIFACT_DIR/requirements.md"
              ;;

            03)
              AGENT=".github/copilot/03-design-review-agent.instructions.md"
              PROMPT=".github/prompts/03-design-review.md"
              OUTPUT="$ARTIFACT_DIR/design-review.md"
              REQUIRED="$ARTIFACT_DIR/requirements.md $ARTIFACT_DIR/architecture.md"
              ;;

            04)
              AGENT=".github/copilot/04-planning-agent.instructions.md"
              PROMPT=".github/prompts/04-planning.md"
              OUTPUT="$ARTIFACT_DIR/impl-plan.md"
              REQUIRED="$ARTIFACT_DIR/requirements.md $ARTIFACT_DIR/architecture.md"
              ;;

            05)
              AGENT=".github/copilot/05-implementation-agent.instructions.md"
              PROMPT=".github/prompts/05-implementation.md"
              OUTPUT="Source code and tests"
              REQUIRED="$ARTIFACT_DIR/requirements.md $ARTIFACT_DIR/architecture.md $ARTIFACT_DIR/impl-plan.md"
              ;;

            06)
              AGENT=".github/copilot/06-review-agent.instructions.md"
              PROMPT=".github/prompts/06-review.md"
              OUTPUT="$ARTIFACT_DIR/review.md"
              REQUIRED="$ARTIFACT_DIR/requirements.md $ARTIFACT_DIR/architecture.md $ARTIFACT_DIR/impl-plan.md"
              ;;

            07)
              AGENT=".github/copilot/07-verification-agent.instructions.md"
              PROMPT=".github/prompts/07-verification.md"
              OUTPUT="$ARTIFACT_DIR/verification.md"
              REQUIRED="$ARTIFACT_DIR/review.md"
              ;;

            08)
              AGENT=".github/copilot/08-pr-agent.instructions.md"
              PROMPT=".github/prompts/08-pr.md"
              OUTPUT="Pull Request"
              REQUIRED="$ARTIFACT_DIR/verification.md"
              ;;

            *)
              echo "ERROR: Invalid phase"
              exit 1
              ;;
          esac

          echo ""
          echo "Agent:  $AGENT"
          echo "Prompt: $PROMPT"
          echo "Output: $OUTPUT"

          echo ""
          echo "Checking agent..."
          test -f "$AGENT"

          echo "Checking prompt..."
          test -f "$PROMPT"

          echo "Checking artifact directory..."
          test -d "docs/artifacts"

          echo ""
          echo "Checking phase dependencies..."

          if [ -n "${REQUIRED:-}" ]; then
            for FILE in $REQUIRED; do
              if [ ! -f "$FILE" ]; then
                echo ""
                echo "BLOCKED"
                echo "Missing required artifact:"
                echo "  $FILE"
                echo ""
                echo "Phase $PHASE cannot proceed."
                exit 1
              fi

              echo "OK: $FILE"
            done
          fi

          echo ""
          echo "========================================"
          echo "Phase validation: PASSED"
          echo "========================================"

      - name: Show existing artifacts
        shell: bash
        run: |
          STORY="${{ inputs.user_story_id }}"
          ARTIFACT_DIR="docs/artifacts/$STORY"

          echo ""
          echo "========================================"
          echo "Existing Story Artifacts"
          echo "========================================"

          if [ -d "$ARTIFACT_DIR" ]; then
            find "$ARTIFACT_DIR" -maxdepth 1 -type f -print | sort
          else
            echo "No artifacts created yet."
          fi

      - name: Human approval reminder
        run: |
          echo ""
          echo "========================================"
          echo "HUMAN-IN-THE-LOOP"
          echo "========================================"
          echo ""
          echo "Phase ${{ inputs.phase }} is validated."
          echo ""
          echo "Actual Copilot Agent execution occurs"
          echo "through GitHub Copilot / VS Code."
          echo ""
          echo "The next phase MUST NOT proceed until"
          echo "the current phase has human approval."
          echo ""
          echo "========================================"